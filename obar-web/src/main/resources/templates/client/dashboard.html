<!doctype html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cliente | Obar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQroZ4p+Jz93T2IFf6pHfWqfHcYjtdY=" crossorigin="">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/app.css">
</head>

<body class="client-page">
    <header th:replace="~{fragments/client-navbar :: navbar('new')}"></header>

    <main class="client-shell">
        <section class="ride-request" aria-label="Pedir viagem">
            <div class="ride-sidebar">
                <div>
                    <h1>Solicitar Viagem</h1>
                    <p class="muted">Para onde vais hoje?</p>
                </div>

                <div class="ride-form">
                    <label class="search-field">
                        Origem
                        <input type="search" autocomplete="off" placeholder="A obter localiza&#x00E7;&#x00E3;o atual..."
                            data-origin-input>
                        <div class="suggestions-list" data-origin-suggestions hidden></div>
                        <span class="field-note" data-origin-status>Localiza&#x00E7;&#x00E3;o ainda n&#x00E3;o definida.</span>
                    </label>

                    <button class="ghost-button" type="button" data-locate-button hidden>Usar localiza&#x00E7;&#x00E3;o atual</button>

                    <label class="search-field">
                        Destino
                        <input type="search" autocomplete="off" placeholder="Rua, cidade ou ponto de interesse"
                            data-destination-input>
                        <div class="suggestions-list" data-location-suggestions hidden></div>
                    </label>

                    <label class="search-field vehicle-category-field">
                        Tipo de ve&#x00ED;culo
                        <select data-vehicle-category>
                            <option th:each="category : ${vehicleCategories}" th:value="${category}"
                                th:text="${category}">STANDARD</option>
                        </select>
                    </label>

                    <label class="search-field schedule-field">
                        Agendar para
                        <input type="datetime-local" data-scheduled-at>
                    </label>
                </div>

                <div class="estimate-panel" data-estimate-panel hidden>
                    <div>
                        <span>Dist&#x00E2;ncia</span>
                        <strong data-distance>0 km</strong>
                    </div>
                    <div>
                        <span>Dura&#x00E7;&#x00E3;o</span>
                        <strong data-duration>0 min</strong>
                    </div>
                    <div>
                        <span>Pre&#x00E7;o</span>
                        <strong data-price>0,00 &#x20AC;</strong>
                    </div>
                    <button class="primary-button" type="button" data-request-button disabled>Pedir viagem</button>
                    <button class="ghost-button" type="button" data-schedule-button disabled>Agendar viagem</button>
                </div>

                <div class="waiting-panel" data-waiting-panel hidden>
                    <div class="waiting-indicator" aria-hidden="true"></div>
                    <div>
                        <span class="field-title">Pedido enviado</span>
                        <strong data-waiting-title>&#x00C0; espera de motorista</strong>
                        <p>A procurar um motorista dispon&#x00ED;vel para aceitar a viagem.</p>
                        <div class="trip-pin" data-trip-pin-block hidden>
                            <span>PIN para come&#x00E7;ar</span>
                            <strong data-trip-pin>0000</strong>
                        </div>
                    </div>
                    <button class="ghost-button danger-button" type="button" data-cancel-trip-button>Cancelar
                        pedido</button>
                </div>

                <p class="ride-message" data-ride-message hidden></p>
            </div>

            <div class="map-panel">
                <div id="ride-map"></div>
            </div>
        </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script th:src="@{/js/client-map.js}"></script>
</body>

</html>
