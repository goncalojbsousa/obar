<!doctype html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Obar</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body class="login-auth-page">
    <main class="login-auth-shell">
        <section class="login-hero" aria-label="Obar">
            <a class="brand login-brand" th:href="@{/login}" aria-label="OBAR">
                <span class="brand-mark" aria-hidden="true">O</span><span class="brand-text">bar</span>
            </a>

            <div class="login-hero-copy">
                <h1>A tua viagem,<span>no teu ritmo.</span></h1>
                <p>Pede viagens, acompanha pedidos e gere os teus dados de cliente.</p>
            </div>

            <div class="login-route-preview" aria-hidden="true">
                <div class="login-route-line">
                    <span class="login-route-dot origin"></span>
                    <span class="login-route-track"></span>
                    <span class="login-route-dot destination"></span>
                </div>
                <div class="login-stats-row">
                    <div>
                        <strong>2.4k+</strong>
                        <span>VIAGENS ESTE MES</span>
                    </div>
                    <div>
                        <strong>98%</strong>
                        <span>SATISFACAO</span>
                    </div>
                    <div>
                        <strong>4.8</strong>
                        <span>AVALIACAO MEDIA</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="login-form-side" aria-label="Entrar na conta Obar">
            <div class="login-card">
                <nav class="login-segment" aria-label="Autenticacao">
                    <a class="active" th:href="@{/login}">Entrar</a>
                    <a th:href="@{/register}">Criar conta</a>
                </nav>

                <div class="login-heading">
                    <h1 id="login-title">Bem-vindo!</h1>
                    <p>Entra na tua conta para continuar</p>
                </div>

                <p class="login-alert success" th:if="${param.logout}">Sessao terminada.</p>
                <p class="login-alert" th:if="${error}" th:text="${error}"></p>

                <form class="login-form" th:action="@{/login}" th:object="${loginForm}" method="post">
                    <label class="login-field">
                        <span>Email</span>
                        <input type="email" th:field="*{email}" placeholder="o.teu@email.com" autocomplete="email"
                            required autofocus>
                    </label>

                    <label class="login-field">
                        <span>Palavra-passe</span>
                        <input type="password" th:field="*{password}" placeholder="********"
                            autocomplete="current-password" required>
                    </label>

                    <button class="login-submit" type="submit">Entrar</button>
                </form>

                <p class="login-security-note">Acesso seguro para clientes Obar</p>
            </div>
        </section>
    </main>
</body>

</html>
