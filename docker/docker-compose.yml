services:
  db:
    image: postgres:16
    container_name: obar-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-obar}
      POSTGRES_USER: ${DB_USER:-obar_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-obar_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
