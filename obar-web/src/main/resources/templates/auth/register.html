<!doctype html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | Obar</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body class="login-auth-page">
    <main class="login-auth-shell">
        <section class="login-hero" aria-label="Obar">
            <a class="brand login-brand" th:href="@{/login}" aria-label="OBAR">
                <span class="brand-mark" aria-hidden="true">O</span><span class="brand-text">bar</span>
            </a>

            <div class="login-hero-copy">
                <h1>A tua viagem,<span>no teu ritmo.</span></h1>
                <p>Pede viagens, acompanha pedidos e gere os teus dados de cliente.</p>
            </div>

            <div class="login-route-preview" aria-hidden="true">
                <div class="login-route-line">
                    <span class="login-route-dot origin"></span>
                    <span class="login-route-track"></span>
                    <span class="login-route-dot destination"></span>
                </div>
                <div class="login-stats-row">
                    <div>
                        <strong>2.4k+</strong>
                        <span>VIAGENS ESTE MES</span>
                    </div>
                    <div>
                        <strong>98%</strong>
                        <span>SATISFACAO</span>
                    </div>
                    <div>
                        <strong>4.8</strong>
                        <span>AVALIACAO MEDIA</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="login-form-side" aria-label="Criar conta Obar">
            <div class="login-card register-card">
                <nav class="login-segment" aria-label="Autenticacao">
                    <a th:href="@{/login}">Entrar</a>
                    <a class="active" th:href="@{/register}">Criar conta</a>
                </nav>

                <div class="login-heading">
                    <h1 id="register-title">Criar conta cliente</h1>
                    <p>Cria uma conta cliente para pedir viagens pela web.</p>
                </div>

                <p class="login-alert" th:if="${error}" th:text="${error}"></p>

                <form class="login-form register-form" th:action="@{/register}" th:object="${registerForm}"
                    method="post">
                    <div class="register-fields-grid">
                        <label class="login-field">
                            <span>Nome</span>
                            <input type="text" th:field="*{name}" placeholder="O teu nome" autocomplete="name" required
                                autofocus>
                        </label>

                        <label class="login-field">
                            <span>Email</span>
                            <input type="email" th:field="*{email}" placeholder="o.teu@email.com" autocomplete="email"
                                required>
                        </label>

                        <label class="login-field">
                            <span>Telefone</span>
                            <input type="tel" th:field="*{phone}" placeholder="912 345 678" autocomplete="tel">
                        </label>

                        <label class="login-field">
                            <span>NIF</span>
                            <input type="text" th:field="*{taxNumber}" placeholder="123456789" inputmode="numeric">
                        </label>

                        <label class="login-field">
                            <span>Palavra-passe</span>
                            <input type="password" th:field="*{password}" placeholder="********"
                                autocomplete="new-password" required>
                        </label>

                        <label class="login-field">
                            <span>Confirmar palavra-passe</span>
                            <input type="password" th:field="*{confirmPassword}" placeholder="********"
                                autocomplete="new-password" required>
                        </label>
                    </div>

                    <button class="login-submit" type="submit">Criar conta</button>
                </form>

                <p class="login-security-note">Acesso seguro para clientes Obar</p>
            </div>
        </section>
    </main>
</body>

</html>
