<!doctype html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viagens Agendadas | Obar</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/app.css">
</head>

<body class="client-page scheduled-page">
    <header th:replace="~{fragments/client-navbar :: navbar('scheduled')}"></header>

    <main class="client-shell scheduled-shell">
        <section class="scheduled-trips" aria-label="Viagens agendadas">
            <div class="scheduled-header">
                <div>
                    <h1>Viagens Agendadas</h1>
                    <p class="muted">Pedidos marcados para uma data e hora espec&#x00ED;ficas.</p>
                </div>
                <a class="primary-button inline-action" th:href="@{/app}">Nova viagem</a>
            </div>

            <div class="empty-state" th:if="${#lists.isEmpty(scheduledTrips)}">
                <strong>Sem viagens agendadas</strong>
                <p>Quando agendares uma viagem, ela aparece aqui.</p>
            </div>

            <div class="scheduled-list" th:if="${!#lists.isEmpty(scheduledTrips)}">
                <article class="scheduled-trip-card" th:each="trip : ${scheduledTrips}">
                    <div>
                        <span class="field-title"
                            th:text="${#temporals.format(trip.scheduledTime(), 'dd/MM/yyyy HH:mm')}">26/05/2026
                            09:30</span>
                        <strong th:text="${trip.destinationAddress()}">Destino</strong>
                        <p>
                            <span th:text="${trip.originAddress()}">Origem</span>
                            <span> -> </span>
                            <span th:text="${trip.destinationAddress()}">Destino</span>
                        </p>
                    </div>
                    <div class="scheduled-meta">
                        <span th:text="${trip.vehicleCategory()}">STANDARD</span>
                        <span th:text="${trip.status()}">PENDING</span>
                        <span th:text="${#numbers.formatCurrency(trip.estimatedPrice())}">0,00 &#x20AC;</span>
                    </div>
                    <p class="muted" th:if="${trip.driverName() != null}">
                        Motorista:
                        <span th:text="${trip.driverName()}">Motorista</span>
                        <span th:if="${trip.vehicleDisplay() != null}"> &#x00B7; </span>
                        <span th:if="${trip.vehicleDisplay() != null}" th:text="${trip.vehicleDisplay()}">Ve&#x00ED;culo</span>
                    </p>
                    <form th:if="${trip.canCancel()}" th:action="@{/app/scheduled/{id}/cancel(id=${trip.id()})}"
                        method="post">
                        <label class="cancel-reason-field">
                            Motivo do cancelamento
                            <input type="text" name="reason" required minlength="3" maxlength="255"
                                placeholder="Indica o motivo">
                        </label>
                        <button class="ghost-button danger-button" type="submit">Cancelar</button>
                    </form>
                </article>
            </div>
        </section>
    </main>
</body>

</html>
